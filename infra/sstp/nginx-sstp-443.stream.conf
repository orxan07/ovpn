# Include at nginx's top level, outside http {}. Requires libnginx-mod-stream.
# The HTTPS virtual host must listen on 127.0.0.1:8443 ssl instead of 443 ssl.
# TLS passes through unchanged: SSTP keeps accel-ppp's existing certificate.
stream {
    map $ssl_preread_server_name $sstp_https_backend {
        ""              127.0.0.1:14942;
        171.22.75.104    127.0.0.1:14942;
        default         127.0.0.1:8443;
    }

    log_format sstp_https_entry '$remote_addr:$remote_port [$time_local] '
                              'sni="$ssl_preread_server_name" upstream=$upstream_addr '
                              'status=$status duration=$session_time '
                              'sent=$bytes_sent received=$bytes_received';

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $sstp_https_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        access_log /var/log/nginx/sstp-443.log sstp_https_entry;
    }
}
